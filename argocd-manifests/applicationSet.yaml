apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-dev
  namespace: argocd
spec:
  generators:
      - git:
          repoURL: 'https://github.com/jose-montenegro-romero/argocd-application-deploy.git'
          revision: HEAD
          files:
            - path: 'apps-aws/*/config.yaml'
        selector:
          matchExpressions:
            - key: "deploy_config.dev"
              operator: In
              values:
                - "true"
  template:
    metadata:
      name: 'dev-{{path.basename}}'
    spec:
      project: default
      sources:
        # Origen A: El Chart de Helm base
        - repoURL: 'https://github.com/jose-montenegro-romero/helm-aws.git'
          targetRevision: HEAD
          path: transversal
          # Esto le dice a ArgoCD de dónde sacar los valores específicos de cada app:
          helm:
            valueFiles:
              - '$config/apps-aws/{{path.basename}}/values.yaml'
        # Origen B: El repositorio de configuraciones
        - repoURL: 'https://github.com/jose-montenegro-romero/argocd-application-deploy.git'
          targetRevision: HEAD
          ref: config
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{deploy_config.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false